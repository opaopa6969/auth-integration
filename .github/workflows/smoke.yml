name: smoke

# Issue #1: setup.sh → compose up → health check の再現性を機械検証
# 範囲: A案（最小）— 起動して各 service の healthcheck が green になること。
# Magic Link / token 取得（B案）や docs lint（C案）は意図的に含めない:
#   - B案は auth-proxy 本体の機能テストであり、この repo の配管検証範囲外
#   - C案は別 PR で段階導入可能
# 平文機密値は扱わない（dev ローカルファイル前提は Issue 本文通り）。
#
# console (admin SPA) はホストでビルド済みの dist/ を前提とし、かつ
# file:../DxE-suite 依存があるため CI 環境ではビルドできない。
# 配管検証（A案）において console は必須でないため、build/up で明示的に除外する。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  setup-and-up:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout は github.workspace 直下に配置する。
      # setup.sh は自分の親 (= github.workspace) に兄弟 repo を clone するので、
      # この repo を github.workspace/auth-integration に配置することで
      # 想定レイアウト (auth-study/auth-integration + 兄弟) を再現する。
      - name: Checkout auth-integration
        uses: actions/checkout@v4
        with:
          path: auth-integration

      - name: Setup workspace (clone sibling repos)
        working-directory: ${{ github.workspace }}/auth-integration
        run: ./setup.sh

      - name: Generate dev env (JWT keys + auth-proxy-dev.env)
        working-directory: ${{ github.workspace }}/auth-integration
        run: ./dev/gen-dev-env.sh

      - name: Build images (exclude console, needs prebuilt dist/)
        working-directory: ${{ github.workspace }}/auth-integration
        # --no-deps: gateway は console に depends_on するが、console は
        # dist/ が無いと build できないため依存 build を抑制する。
        run: docker compose build --no-deps postgres redis mailpit auth-proxy todo-sample gateway

      - name: Up (detached, exclude console)
        working-directory: ${{ github.workspace }}/auth-integration
        # --no-deps: console の自動起動を抑制。起動順は依存関係に従い手動で。
        # 依存 service が未起動でも healthcheck が retry で待つので冪等。
        run: |
          docker compose up -d --no-deps postgres redis mailpit
          docker compose up -d --no-deps auth-proxy todo-sample
          docker compose up -d --no-deps gateway

      - name: Wait for gateway healthy
        working-directory: ${{ github.workspace }}/auth-integration
        env:
          MAX_WAIT: 300
        run: |
          # 各 service は healthcheck を持つ。compose up -d のあと
          # gateway が healthy になれば下流 (auth-proxy/todo-sample) も
          # depends_on で起動済み。gateway の /login が 200 になるまで待つ。
          for i in $(seq 1 "$MAX_WAIT"); do
            code=$(docker compose exec -T gateway curl -s -o /dev/null -w '%{http_code}' http://localhost:28888/login 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "gateway /login -> 200 (after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "gateway /login did not return 200 within ${MAX_WAIT}s"
          docker compose ps
          docker compose logs --tail=50
          exit 1

      - name: Service health summary
        working-directory: ${{ github.workspace }}/auth-integration
        run: |
          # healthcheck を持つ service の状態を表示
          docker compose ps
          # postgres / auth-proxy / gateway が healthy であることを確認
          for svc in postgres auth-proxy gateway; do
            state=$(docker compose ps --format json "$svc" | jq -r '.Health' 2>/dev/null || echo "unknown")
            echo "$svc: $state"
          done

      - name: Dump logs on failure
        if: failure()
        working-directory: ${{ github.workspace }}/auth-integration
        run: |
          docker compose ps --all
          docker compose logs --tail=100
